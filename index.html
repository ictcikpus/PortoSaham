<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dividen & Portfolio Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Top Navbar -->
  <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-blue-600/30">
          📈
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg text-white tracking-tight">Dividen Pro</h1>
          <p class="text-xs text-slate-400">Portfolio & Dividend Action System</p>
        </div>
      </div>
      <button onclick="fetchData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm px-4 py-2 rounded-xl border border-slate-700/60 flex items-center gap-2 transition active:scale-95">
        <span id="syncIcon">🔄</span> Sinkronisasi
      </button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-8 mt-8">
    
    <!-- KPI Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="bg-slate-800/60 border border-slate-700/50 p-5 rounded-2xl">
        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Nilai Pasar</span>
        <h2 id="totalMkt" class="text-2xl font-bold text-white mt-1">Rp 0</h2>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/50 p-5 rounded-2xl">
        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Return</span>
        <h2 id="totalReturn" class="text-2xl font-bold text-white mt-1">0.00%</h2>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/50 p-5 rounded-2xl">
        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Dividen Tahunan</span>
        <h2 id="totalDiv" class="text-2xl font-bold text-emerald-400 mt-1">Rp 0</h2>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/50 p-5 rounded-2xl">
        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Gaji Pasif / Bulan</span>
        <h2 id="monthlySalary" class="text-2xl font-bold text-blue-400 mt-1">Rp 0</h2>
      </div>
    </div>

    <!-- Data Table Card -->
    <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl overflow-hidden backdrop-blur-sm">
      <div class="p-5 border-b border-slate-700/50 flex justify-between items-center">
        <h3 class="font-bold text-white">Daftar Portofolio & Watchlist</h3>
        <span id="loader" class="text-xs text-blue-400 animate-pulse font-medium hidden">Memuat data dari Google Sheets...</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead>
            <tr class="bg-slate-800/80 text-slate-400 text-xs uppercase font-semibold border-b border-slate-700/50">
              <th class="py-4 px-5">Emiten</th>
              <th class="py-4 px-5">Lot</th>
              <th class="py-4 px-5">Avg Beli</th>
              <th class="py-4 px-5">Harga Skrg</th>
              <th class="py-4 px-5">Gain/Loss</th>
              <th class="py-4 px-5">Yield (%)</th>
              <th class="py-4 px-5">Sinyal Aksi</th>
              <th class="py-4 px-5 text-center">Kelola</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-800 text-slate-200">
            <!-- Data dimasukkan secara otomatis via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Edit Modal -->
  <div id="modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-md flex items-center justify-center hidden p-4 z-50">
    <div class="bg-slate-900 border border-slate-700/60 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 id="modalTitle" class="text-lg font-bold text-white mb-4">Edit Saham</h3>
      <form onsubmit="saveData(event)" class="space-y-4">
        <input type="hidden" id="editRowIdx">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Jumlah Lot</label>
          <input type="number" id="editLot" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Harga Avg Beli (Rp)</label>
          <input type="number" id="editAvg" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Harga Skrg / Running (Rp)</label>
          <input type="number" id="editHarga" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Estimasi DPS (Rp)</label>
          <input type="number" id="editDPS" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div class="flex justify-end gap-3 mt-6">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-400 hover:text-white transition">Batal</button>
          <button type="submit" id="btnSave" class="px-5 py-2.5 text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition">Simpan Data</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // PASTE URL GOOGLE APPS SCRIPT ANDA DI SINI
    const API_URL = "https://script.google.com/macros/library/d/131m98D_c2MaT4W4Nd2aeS5l-gQQQUHQjn4CxndvzIC7wV3rj3HC5IYgX/1";

    let rawData = [];

    function formatRp(num) {
      return 'Rp ' + Math.round(num).toLocaleString('id-ID');
    }

    async function fetchData() {
      const loader = document.getElementById('loader');
      loader.classList.remove('hidden');
      try {
        const res = await fetch(API_URL);
        rawData = await res.json();
        renderTable(rawData);
      } catch (err) {
        alert('Gagal mengambil data dari server. Periksa koneksi atau URL API.');
      } finally {
        loader.classList.add('hidden');
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      let totalMkt = 0, totalCost = 0, totalDiv = 0;

      data.forEach(item => {
        totalMkt += item.nilaiPasar;
        totalCost += item.modal;
        totalDiv += item.divTahun;

        const glColor = item.gainLoss >= 0 ? 'text-emerald-400' : 'text-rose-400';
        const glPrefix = item.gainLoss >= 0 ? '+' : '';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-800/40 transition">
            <td class="py-4 px-5">
              <div class="font-bold text-white">${item.kode}</div>
              <div class="text-xs text-slate-400">${item.nama}</div>
            </td>
            <td class="py-4 px-5 font-medium">${item.lot}</td>
            <td class="py-4 px-5">${formatRp(item.avgBeli)}</td>
            <td class="py-4 px-5 font-semibold text-white">${formatRp(item.hargaSkrg)}</td>
            <td class="py-4 px-5 ${glColor} font-semibold">${glPrefix}${item.gainLoss}%</td>
            <td class="py-4 px-5">${item.yieldPct}%</td>
            <td class="py-4 px-5">
              <span class="text-xs font-bold px-3 py-1 rounded-full ${item.signalClass}">
                ${item.signal}
              </span>
            </td>
            <td class="py-4 px-5 text-center">
              <button onclick="openModal(${item.rowIdx})" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                ✏️ Edit
              </button>
            </td>
          </tr>
        `;
      });

      const totalReturn = totalCost > 0 ? ((totalMkt - totalCost) / totalCost) * 100 : 0;
      const monthlySalary = (totalDiv * 0.8) / 12;

      document.getElementById('totalMkt').innerText = formatRp(totalMkt);
      document.getElementById('totalReturn').innerText = (totalReturn >= 0 ? '+' : '') + totalReturn.toFixed(2) + '%';
      document.getElementById('totalDiv').innerText = formatRp(totalDiv);
      document.getElementById('monthlySalary').innerText = formatRp(monthlySalary);
    }

    function openModal(rowIdx) {
      const item = rawData.find(d => d.rowIdx === rowIdx);
      if (!item) return;

      document.getElementById('editRowIdx').value = item.rowIdx;
      document.getElementById('modalTitle').innerText = 'Update Data ' + item.kode;
      document.getElementById('editLot').value = item.lot;
      document.getElementById('editAvg').value = item.avgBeli;
      document.getElementById('editHarga').value = item.hargaSkrg;
      document.getElementById('editDPS').value = item.dps;
      
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    async function saveData(e) {
      e.preventDefault();
      const btnSave = document.getElementById('btnSave');
      btnSave.innerText = 'Menyimpan...';
      btnSave.disabled = true;

      const payload = {
        rowIdx: Number(document.getElementById('editRowIdx').value),
        lot: Number(document.getElementById('editLot').value),
        avgBeli: Number(document.getElementById('editAvg').value),
        hargaSkrg: Number(document.getElementById('editHarga').value),
        dps: Number(document.getElementById('editDPS').value)
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        closeModal();
        await fetchData();
      } catch (err) {
        alert('Gagal menyimpan perubahan.');
      } finally {
        btnSave.innerText = 'Simpan Data';
        btnSave.disabled = false;
      }
    }

    window.onload = fetchData;
  </script>
</body>
</html>
